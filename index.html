<!doctype html>
<html lang="en">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f7f3" />
  <title>FocusFlow — Your space. Your pace.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { ink: '#24313b', muted: '#71808b', cream: '#f8f7f3', blue: '#dcecf3', sage: '#dceadd', lavender: '#e9e2f4', peach: '#f6dfd1', line: '#e7e7e2' },
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },

    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box } body { margin:0; background:#f8f7f3; color:#24313b; font-family:'DM Sans',sans-serif; } button,input,select,textarea { font:inherit } button { cursor:pointer } .serif {font-family:'Playfair Display',serif} .scrollbar::-webkit-scrollbar{width:5px}.scrollbar::-webkit-scrollbar-thumb{background:#d8ddd9;border-radius:5px}.fade{animation:fade .28s ease-out}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}} .progress-ring{transform:rotate(-90deg)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo} = React;
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const seedTasks=[
 {id:'1',title:'Reply to project emails',priority:'Medium',due:today(),done:true,subtasks:[]},
 {id:'2',title:'Prepare presentation outline',priority:'High',due:today(),done:false,subtasks:['Collect three key ideas','Open a blank document']},
 {id:'3',title:'10-minute tidy reset',priority:'Low',due:today(),done:false,subtasks:[]},
 {id:'4',title:'Book dentist appointment',priority:'Low',due:'2026-11-06',done:false,subtasks:[]}
];
const seedHabits=[{id:'h1',name:'Drink enough water',goal:'Daily',done:true,days:5},{id:'h2',name:'Stretch for 5 minutes',goal:'Daily',done:false,days:3},{id:'h3',name:'Plan tomorrow gently',goal:'Weekly',done:false,days:2}];
function useStore(key,initial){const [value,setValue]=useState(()=>{try{return JSON.parse(localStorage.getItem(key))??initial}catch{return initial}});useEffect(()=>localStorage.setItem(key,JSON.stringify(value)),[key,value]);return [value,setValue]}
function Icon({name,size=18,strokeWidth=1.8,className=''}){useEffect(()=>{if(window.lucide)lucide.createIcons({attrs:{'stroke-width':strokeWidth}})},[]);return <i data-lucide={name} className={className} style={{width:size,height:size}}/>}
const nav=[['layout-dashboard','Dashboard','dashboard'],['check-square-2','My Tasks','tasks'],['timer','Focus Room','focus'],['calendar-days','My Schedule','schedule'],['sun-medium','Mood & Energy','mood'],['sprout','Habit Tracker','habits'],['settings-2','Settings','settings']];
function Pill({children,tone='blue'}){return <span className={'text-[11px] font-semibold px-2.5 py-1 rounded-full '+({blue:'bg-blue text-[#4c7687]',sage:'bg-sage text-[#52755e]',lavender:'bg-lavender text-[#75638d]',peach:'bg-peach text-[#9a6653]'}[tone])}>{children}</span>}
function SectionTitle({eyebrow,title,sub}){return <div className="mb-7"><div className="text-[11px] uppercase tracking-[.17em] font-bold text-[#8b9aa2] mb-2">{eyebrow}</div><h1 className="serif text-[31px] leading-tight">{title}</h1>{sub&&<p className="text-sm text-muted mt-2">{sub}</p>}</div>}
function Card({children,className=''}){return <div className={'bg-white border border-line rounded-[22px] shadow-card '+className}>{children}</div>}
function Modal({title,onClose,children}){return <div className="fixed inset-0 z-50 bg-ink/30 backdrop-blur-sm flex items-center justify-center p-4"><div className="bg-cream rounded-[24px] shadow-soft w-full max-w-lg p-6 fade"><div className="flex justify-between items-center mb-5"><h3 className="serif text-2xl">{title}</h3><button onClick={onClose} className="p-2 hover:bg-white rounded-full"><Icon name="x"/></button></div>{children}</div></div>}
function Field({label,...props}){return <label className="block text-sm font-semibold text-ink mb-4">{label}<input {...props} className="mt-2 w-full px-3.5 py-3 rounded-xl border border-line bg-white outline-none focus:ring-2 focus:ring-blue" /></label>}
function App(){
 const [page,setPage]=useState('dashboard'),[tasks,setTasks]=useStore('ff_tasks',seedTasks),[habits,setHabits]=useStore('ff_habits',seedHabits),[mood,setMood]=useStore('ff_mood',null),[sessions,setSessions]=useStore('ff_sessions',3),[settings,setSettings]=useStore('ff_settings',{focus:25,break:5,notifications:true,ambient:false,font:'comfortable'}),[modal,setModal]=useState(null),[mobileOpen,setMobileOpen]=useState(false);
 const completed=tasks.filter(t=>t.done).length, progress=Math.round(completed/Math.max(tasks.length,1)*100);
 useEffect(()=>{document.documentElement.style.fontSize=settings.font==='large'?'17px':'16px'},[settings.font]);
 const addTask=(task)=>{setTasks(x=>[...x,{...task,id:uid(),done:false,subtasks:[]}]);setModal(null)};
 const toggleTask=id=>setTasks(x=>x.map(t=>t.id===id?{...t,done:!t.done}:t));
 const removeTask=id=>setTasks(x=>x.filter(t=>t.id!==id));
 const greeting= new Date().getHours()<12?'Good morning':new Date().getHours()<18?'Good afternoon':'Good evening';
 return <div className="min-h-screen flex">
  <aside className={(mobileOpen?'translate-x-0':'-translate-x-full')+' lg:translate-x-0 fixed lg:static z-40 w-[252px] shrink-0 h-screen bg-[#f1f4f1] border-r border-[#e3e8e3] p-5 flex flex-col transition-transform'}>
   <div className="flex items-center gap-3 px-2 mb-10"><div className="w-9 h-9 rounded-xl bg-[#90b5b0] text-white flex items-center justify-center shadow-sm"><Icon name="waves" size={20}/></div><span className="font-bold tracking-tight text-lg">Focus<span className="text-[#70978d]">Flow</span></span></div>
   <div className="text-[10px] uppercase tracking-[.18em] text-muted font-bold px-3 mb-3">Your space</div><nav className="space-y-1">{nav.map(([icon,label,id])=><button key={id} onClick={()=>{setPage(id);setMobileOpen(false)}} className={'w-full flex items-center gap-3 px-3.5 py-3 rounded-xl text-sm font-semibold transition '+(page===id?'bg-white text-[#527e76] shadow-sm':'text-[#78858c] hover:bg-white/70')}><Icon name={icon} size={18}/>{label}</button>)}</nav>
   <div className="mt-auto"><div className="bg-[#e5efe9] rounded-2xl p-4 mb-5"><div className="flex gap-2 items-start"><Icon name="sparkles" size={16} className="text-[#6f9582] mt-0.5"/><p className="text-xs leading-relaxed text-[#527066]">Small steps still move you forward.</p></div></div><div className="flex items-center gap-3 px-2"><div className="w-9 h-9 rounded-full bg-[#d8c8b6] text-[#725e4c] flex items-center justify-center font-bold text-sm">AM</div><div className="min-w-0"><div className="font-semibold text-sm">Alex Morgan</div><div className="text-xs text-muted">Finding my flow</div></div><button onClick={()=>setPage('settings')} className="ml-auto text-muted"><Icon name="more-horizontal" size={17}/></button></div></div>
  </aside>
  {mobileOpen&&<div onClick={()=>setMobileOpen(false)} className="fixed inset-0 bg-ink/20 z-30 lg:hidden"/>}
  <main className="flex-1 min-w-0"><header className="h-[76px] px-5 sm:px-8 lg:px-12 flex items-center justify-between border-b border-line bg-cream/80 backdrop-blur sticky top-0 z-20"><button className="lg:hidden" onClick={()=>setMobileOpen(true)}><Icon name="menu"/></button><div className="text-xs text-muted hidden sm:block">Thursday, November 5, 2026</div><div className="ml-auto flex items-center gap-3"><button className="w-9 h-9 rounded-full bg-white border border-line flex items-center justify-center text-muted"><Icon name="bell" size={17}/></button><div className="h-7 w-px bg-line"/><span className="text-sm font-semibold hidden sm:block">A little progress today</span><div className="w-8 h-8 rounded-full bg-[#d8c8b6] text-[#725e4c] flex items-center justify-center font-bold text-xs">AM</div></div></header>
  <div className="max-w-[1440px] mx-auto px-5 sm:px-8 lg:px-12 py-8">{page==='dashboard'&&<Dashboard tasks={tasks} completed={completed} progress={progress} greeting={greeting} mood={mood} setMood={setMood} setPage={setPage} setModal={setModal} toggleTask={toggleTask}/>} {page==='tasks'&&<Tasks tasks={tasks} toggleTask={toggleTask} removeTask={removeTask} setTasks={setTasks} setModal={setModal}/>} {page==='focus'&&<Focus tasks={tasks} settings={settings} setSessions={setSessions} sessions={sessions}/>} {page==='schedule'&&<Schedule/>} {page==='mood'&&<Mood mood={mood} setMood={setMood}/>} {page==='habits'&&<Habits habits={habits} setHabits={setHabits}/>} {page==='settings'&&<Settings settings={settings} setSettings={setSettings}/>}</div></main>
  {modal==='task'&&<TaskModal onClose={()=>setModal(null)} onSave={addTask}/>} {modal==='start'&&<StarterModal onClose={()=>setModal(null)} addTask={addTask}/>}</div>
}
function Dashboard({tasks,completed,progress,greeting,mood,setMood,setPage,setModal,toggleTask}){return <div className="fade"><div className="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-8"><SectionTitle eyebrow="Thursday, November 5" title={greeting+', Alex.'} sub="Let's take one step at a time."/><button onClick={()=>setPage('focus')} className="bg-[#557f78] text-white rounded-xl px-5 py-3 text-sm font-bold flex gap-2 items-center hover:bg-[#456c65] transition shadow-sm"><Icon name="play" size={16} fill="currentColor"/> Start focus session</button></div><div className="grid grid-cols-1 lg:grid-cols-[1.6fr_1fr] gap-5 mb-5"><Card className="p-6 sm:p-7 bg-[#e3eef1] border-0"><div className="flex justify-between gap-5"><div><Pill>YOUR DAY</Pill><h2 className="serif text-2xl mt-4">A gentle plan for today</h2><p className="text-sm text-[#5d727b] mt-2 max-w-sm">You have space for progress, rest, and whatever comes up.</p></div><div className="relative w-24 h-24 shrink-0"><svg className="progress-ring w-24 h-24"><circle cx="48" cy="48" r="38" fill="none" stroke="#c8d9db" strokeWidth="8"/><circle cx="48" cy="48" r="38" fill="none" stroke="#638c8a" strokeWidth="8" strokeLinecap="round" strokeDasharray="239" strokeDashoffset={239-(239*progress/100)}/></svg><span className="absolute inset-0 flex items-center justify-center font-bold text-lg">{progress}%</span></div></div><div className="mt-8 flex justify-between text-xs text-[#5d727b]"><span>{completed} of {tasks.length} tasks complete</span><span>{tasks.length-completed} remaining</span></div><div className="h-2 bg-white/70 rounded-full mt-2 overflow-hidden"><div style={{width:progress+'%'}} className="h-full bg-[#739e9a] rounded-full transition-all"/></div></Card><Card className="p-6"><div className="flex items-center justify-between"><div><Pill tone="lavender">CHECK IN</Pill><h2 className="font-bold text-lg mt-4">How's your energy?</h2></div><Icon name="heart" className="text-[#9c87ba]"/></div><div className="grid grid-cols-2 gap-2 mt-5">{[['High','⚡'],['Normal','☀'],['Low','☁'],['Overwhelmed','◌']].map(([x,em])=><button key={x} onClick={()=>setMood(x)} className={'rounded-xl py-3 text-xs font-semibold border transition '+(mood===x?'bg-lavender border-[#d1c5e2] text-[#705d8a]':'border-line text-muted hover:bg-[#faf8fc]')}><span className="block text-base mb-1">{em}</span>{x}</button>)}</div>{mood&&<p className="text-xs text-[#75638d] bg-lavender rounded-lg p-2.5 mt-3">{mood==='Low'||mood==='Overwhelmed'?'Try one tiny task, then pause. Your pace is valid.':'You have a little extra fuel today — use it gently.'}</p>}</Card></div><div className="grid grid-cols-1 xl:grid-cols-[1.4fr_1fr_1fr] gap-5"><Card className="p-6"><div className="flex justify-between items-center mb-5"><div><Pill tone="sage">TODAY'S TASKS</Pill><h2 className="font-bold text-lg mt-3">Keep it light</h2></div><button onClick={()=>setPage('tasks')} className="text-xs font-bold text-[#5f8a7e]">View all <Icon name="arrow-up-right" size={13} className="inline"/></button></div><div className="space-y-3">{tasks.filter(t=>!t.done).slice(0,3).map(t=><TaskRow key={t.id} task={t} toggleTask={toggleTask}/>) }{tasks.filter(t=>!t.done).length===0&&<Empty text="Everything is checked off. Nice work."/>}</div></Card><Card className="p-6 bg-[#f0ebf7] border-0"><Icon name="sparkles" className="text-[#8b75a7]"/><h2 className="serif text-xl mt-4">Help me get started</h2><p className="text-sm text-[#766a83] leading-relaxed mt-2">Turn a stuck task into a few friendly next steps.</p><button onClick={()=>setModal('start')} className="mt-5 text-sm font-bold text-[#765f91] flex items-center gap-2">Break it down <Icon name="arrow-right" size={15}/></button></Card><Card className="p-6 bg-[#e4efdf] border-0"><Icon name="quote" className="text-[#75976d]"/><p className="serif text-xl leading-snug mt-5">“Done is better than perfect, especially when done gently.”</p><p className="text-xs text-[#6e866a] mt-5">A note for your day</p></Card></div></div>}
function TaskRow({task,toggleTask}){return <div className="flex items-center gap-3 p-3 rounded-xl hover:bg-cream transition"><button onClick={()=>toggleTask&&toggleTask(task.id)} className={'w-5 h-5 rounded-full border-2 flex items-center justify-center '+(task.done?'bg-[#6f988c] border-[#6f988c]':'border-[#b9c6c4]')}>{task.done&&<Icon name="check" size={12} className="text-white"/>}</button><div className={'text-sm flex-1 '+(task.done?'line-through text-muted':'font-semibold')}>{task.title}<div className="text-[11px] text-muted mt-1">{task.due===today()?'Today':task.due}</div></div><Pill tone={task.priority==='High'?'peach':task.priority==='Medium'?'lavender':'sage'}>{task.priority}</Pill></div>}
function Empty({text}){return <div className="text-sm text-muted bg-cream rounded-xl p-4 text-center">{text}</div>}
function Tasks({tasks,toggleTask,removeTask,setModal}){const [filter,setFilter]=useState('All');const shown=tasks.filter(t=>filter==='All'||(filter==='Completed'?t.done:t.priority===filter));return <div className="fade"><div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4 mb-7"><SectionTitle eyebrow="Make room for what matters" title="My tasks" sub="A simple list is enough. You can always reschedule."/><div className="flex gap-2"><button onClick={()=>setModal('start')} className="px-4 py-3 rounded-xl border border-line text-sm font-bold bg-white"><Icon name="sparkles" size={15} className="inline mr-2"/>Help me start</button><button onClick={()=>setModal('task')} className="px-4 py-3 rounded-xl bg-[#557f78] text-white text-sm font-bold"><Icon name="plus" size={15} className="inline mr-2"/>Add task</button></div></div><Card className="overflow-hidden"><div className="p-5 border-b border-line flex flex-wrap gap-2">{['All','High','Medium','Low','Completed'].map(x=><button key={x} onClick={()=>setFilter(x)} className={'px-3.5 py-2 rounded-lg text-xs font-bold '+(filter===x?'bg-ink text-white':'bg-cream text-muted')}>{x}</button>)}</div><div className="p-4 sm:p-6 space-y-2">{shown.map(t=><div key={t.id} className="flex items-start gap-3 p-3 rounded-xl hover:bg-cream"><button onClick={()=>toggleTask(t.id)} className={'mt-1 w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0 '+(t.done?'bg-[#6f988c] border-[#6f988c]':'border-[#b9c6c4]')}>{t.done&&<Icon name="check" size={12} className="text-white"/>}</button><div className="flex-1"><div className={'font-semibold text-sm '+(t.done?'line-through text-muted':'')}>{t.title}</div><div className="flex gap-2 items-center mt-2"><Pill tone={t.priority==='High'?'peach':t.priority==='Medium'?'lavender':'sage'}>{t.priority}</Pill><span className="text-xs text-muted"><Icon name="calendar" size={12} className="inline mr-1"/>{t.due===today()?'Today':t.due}</span>{t.subtasks?.length>0&&<span className="text-xs text-muted"><Icon name="list-checks" size={12} className="inline mr-1"/>{t.subtasks.length} steps</span>}</div></div><button onClick={()=>removeTask(t.id)} className="text-muted hover:text-[#b56f68] p-2"><Icon name="trash-2" size={16}/></button></div>)}{shown.length===0&&<Empty text="Nothing here yet. A clear space can be a kind space."/>}</div></Card></div>}
function TaskModal({onClose,onSave}){const [title,setTitle]=useState(''),[priority,setPriority]=useState('Medium'),[due,setDue]=useState(today());return <Modal title="Add a task" onClose={onClose}><Field label="What would you like to do?" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Send the project update" autoFocus/><div className="grid grid-cols-2 gap-3"><label className="text-sm font-semibold">Priority<select value={priority} onChange={e=>setPriority(e.target.value)} className="mt-2 w-full p-3 rounded-xl border border-line bg-white"><option>Low</option><option>Medium</option><option>High</option></select></label><Field label="Due date" type="date" value={due} onChange={e=>setDue(e.target.value)}/></div><button disabled={!title.trim()} onClick={()=>onSave({title:title.trim(),priority,due})} className="w-full mt-2 py-3 rounded-xl bg-[#557f78] text-white font-bold disabled:opacity-40">Add task</button></Modal>}
function StarterModal({onClose,addTask}){const [input,setInput]=useState(''),[steps,setSteps]=useState([]);const generate=()=>{const n=input||'your task';setSteps([`Open what you need for ${n.toLowerCase()}.`,`Find the smallest place to begin.`,`Spend just five minutes on the first step.`,`Write down one thing you noticed or finished.`,`Take a short, guilt-free break.`])};return <Modal title="Help me get started" onClose={onClose}><p className="text-sm text-muted mb-4">What feels hard to begin right now?</p><div className="flex gap-2"><input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&generate()} className="flex-1 p-3 rounded-xl border border-line bg-white outline-none" placeholder="e.g. Study Data Structures"/><button onClick={generate} className="px-4 rounded-xl bg-lavender text-[#735e8d] font-bold">Break it down</button></div>{steps.length>0&&<div className="mt-6"><div className="flex items-center justify-between mb-4"><div><div className="text-xs font-bold uppercase tracking-wider text-muted">Your tiny-step path</div><div className="text-xs text-muted mt-1">Edit any stop. There is no wrong pace.</div></div><div className="w-9 h-9 rounded-full bg-sage flex items-center justify-center text-[#52755e]"><Icon name="route" size={17}/></div></div><div className="relative pl-1">{steps.map((s,i)=><div key={i} className="relative flex gap-3 pb-3 last:pb-0"><div className="flex flex-col items-center"><span className={'relative z-10 w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ring-4 ring-cream '+(i===0?'bg-[#739e9a] text-white':i===steps.length-1?'bg-peach text-[#9a6653]':'bg-lavender text-[#75638d]')}>{i===steps.length-1?<Icon name="flag" size={14}/>:i+1}</span>{i<steps.length-1&&<span className="w-px flex-1 bg-[#d5d0de] my-1"/>}</div><div className="flex-1 pb-2"><div className="rounded-xl border border-line bg-white p-3 shadow-sm"><div className="text-[10px] uppercase tracking-wider font-bold text-muted mb-1">{i===0?'START':i===steps.length-1?'ARRIVE':'NEXT STEP'}</div><input value={s} onChange={e=>setSteps(a=>a.map((x,j)=>j===i?e.target.value:x))} className="w-full bg-transparent outline-none text-sm leading-relaxed"/></div></div></div>)}</div><button onClick={()=>{steps.forEach((s,i)=>addTask({title:s,priority:i===0?'High':'Low',due:today()}));onClose()}} className="w-full mt-5 py-3 rounded-xl bg-[#557f78] text-white font-bold flex items-center justify-center gap-2"><Icon name="list-plus" size={16}/>Add this path to my tasks</button></div>}</Modal>}
function Focus({tasks,settings,setSessions,sessions}){const [seconds,setSeconds]=useState(settings.focus*60),[running,setRunning]=useState(false),[mode,setMode]=useState('Focus'),[selected,setSelected]=useState(tasks.find(t=>!t.done)?.title||'');useEffect(()=>{if(!running)return;const id=setInterval(()=>setSeconds(s=>{if(s<=1){setRunning(false);if(mode==='Focus')setSessions(x=>x+1);return (mode==='Focus'?settings.break:settings.focus)*60}return s-1}),1000);return()=>clearInterval(id)},[running,mode,settings,setSessions]);const reset=()=>{setRunning(false);setSeconds((mode==='Focus'?settings.focus:settings.break)*60)};const mins=String(Math.floor(seconds/60)).padStart(2,'0'),secs=String(seconds%60).padStart(2,'0');return <div className="fade max-w-4xl mx-auto"><SectionTitle eyebrow="A room for one thing" title="Focus room" sub="Settle in. Your only job is to be here for now."/><Card className="p-6 sm:p-10 bg-[#e9f0ee] border-0"><div className="flex justify-center gap-2 mb-8"><button onClick={()=>{setMode('Focus');setSeconds(settings.focus*60);setRunning(false)}} className={'px-4 py-2 rounded-lg text-sm font-bold '+(mode==='Focus'?'bg-white text-[#557f78] shadow-sm':'text-muted')}>Focus</button><button onClick={()=>{setMode('Break');setSeconds(settings.break*60);setRunning(false)}} className={'px-4 py-2 rounded-lg text-sm font-bold '+(mode==='Break'?'bg-white text-[#557f78] shadow-sm':'text-muted')}>Break</button></div><div className="text-center"><div className="text-[88px] sm:text-[125px] font-semibold tracking-tight leading-none text-[#3c6863] tabular-nums">{mins}:{secs}</div><p className="text-sm text-muted mt-4">{mode==='Focus'?'One gentle sprint':'You made space to rest'}</p><select value={selected} onChange={e=>setSelected(e.target.value)} className="mt-6 bg-white border border-line rounded-xl px-4 py-3 text-sm max-w-xs w-full outline-none"><option value="">Choose a task to focus on</option>{tasks.filter(t=>!t.done).map(t=><option key={t.id}>{t.title}</option>)}</select><div className="flex justify-center items-center gap-3 mt-7"><button onClick={reset} className="w-12 h-12 rounded-full bg-white border border-line flex items-center justify-center text-muted"><Icon name="rotate-ccw"/></button><button onClick={()=>setRunning(!running)} className="w-16 h-16 rounded-full bg-[#557f78] text-white flex items-center justify-center shadow-lg hover:scale-105 transition"><Icon name={running?'pause':'play'} fill="currentColor" size={22}/></button><button onClick={()=>setSeconds(0)} className="w-12 h-12 rounded-full bg-white border border-line flex items-center justify-center text-muted"><Icon name="skip-forward"/></button></div></div></Card><div className="grid sm:grid-cols-3 gap-4 mt-5"><Card className="p-5"><div className="text-muted"><Icon name="target"/></div><div className="text-2xl font-bold mt-3">{sessions}</div><div className="text-xs text-muted mt-1">Sessions completed</div></Card><Card className="p-5"><div className="text-muted"><Icon name="clock-3"/></div><div className="text-2xl font-bold mt-3">{settings.focus} min</div><div className="text-xs text-muted mt-1">Focus rhythm</div></Card><Card className="p-5"><div className="text-muted"><Icon name="volume-2"/></div><div className="flex justify-between items-center mt-3"><div className="font-bold">Ambient sounds</div><div className="w-10 h-5 rounded-full bg-[#cbd8d2]"><div className="w-5 h-5 bg-white shadow rounded-full"/></div></div><div className="text-xs text-muted mt-1">A quiet background, optional</div></Card></div></div>}
function Schedule(){const items=[['09:00','Morning reset','Start slowly: water, light, and a plan.','sage'],['10:30','Deep work block','Prepare presentation outline','blue'],['13:00','Lunch & outside time','A real pause counts too.','peach'],['15:30','Admin hour','Reply to emails and small tasks','lavender']];return <div className="fade"><SectionTitle eyebrow="See the shape of your day" title="My schedule" sub="A flexible map, not a set of rules."/><div className="grid lg:grid-cols-[1.7fr_1fr] gap-5"><Card className="p-6"><div className="flex justify-between items-center mb-6"><div className="font-bold">Thursday, November 5</div><button className="text-sm font-bold text-[#5f8a7e]"><Icon name="plus" size={15} className="inline mr-1"/>Add activity</button></div><div className="space-y-1">{items.map(([time,title,sub,tone],i)=><div key={title} className="flex gap-4 min-h-[92px]"><div className="w-14 text-xs text-muted pt-2">{time}</div><div className="relative flex-1 border-l border-line pl-6 pb-5"><span className={'absolute -left-[6px] top-2 w-3 h-3 rounded-full ring-4 ring-white '+({sage:'bg-[#80a889]',blue:'bg-[#82aebb]',peach:'bg-[#d99b7e]',lavender:'bg-[#ae9aca]'}[tone])}/><div className="bg-cream rounded-xl p-3"><div className="font-semibold text-sm">{title}</div><div className="text-xs text-muted mt-1">{sub}</div></div></div></div>)}</div></Card><Card className="p-6 bg-[#f0ebf7] border-0"><Pill tone="lavender">COMING UP</Pill><h2 className="serif text-2xl mt-4">A kind reminder</h2><p className="text-sm text-[#766a83] leading-relaxed mt-2">Your next block is in 38 minutes. You have time to transition.</p><div className="mt-6 p-4 bg-white/60 rounded-xl"><div className="text-xs text-muted">NEXT</div><div className="font-bold mt-1">Prepare presentation outline</div><div className="text-xs text-[#766a83] mt-2">10:30 — 11:30</div></div></Card></div></div>}
function Mood({mood,setMood}){const opts=[['High energy','⚡','You have fuel to spend. Try a meaningful task with a clear finish.'],['Normal energy','☀','A balanced day is a good day for steady, familiar tasks.'],['Low energy','☁','Choose a five-minute version of something. Smaller still counts.'],['Feeling overwhelmed','◌','Pause, breathe, and remove one thing from the list. You are safe to go slowly.']];return <div className="fade"><SectionTitle eyebrow="Notice, don't judge" title="Mood & energy" sub="A check-in can help you choose the right-sized next step."/><div className="grid lg:grid-cols-[1.35fr_1fr] gap-5"><Card className="p-6"><h2 className="font-bold mb-5">How are you arriving today?</h2><div className="grid sm:grid-cols-2 gap-3">{opts.map(([name,em,sug])=><button onClick={()=>setMood(name)} key={name} className={'text-left p-4 rounded-2xl border transition '+(mood===name?'border-[#bca9d2] bg-lavender':'border-line hover:bg-cream')}><div className="text-2xl">{em}</div><div className="font-bold text-sm mt-3">{name}</div><div className="text-xs text-muted mt-1 leading-relaxed">{sug}</div></button>)}</div>{mood&&<div className="mt-5 bg-sage rounded-xl p-4 text-sm text-[#52755e]"><b>For this energy:</b> {opts.find(x=>x[0]===mood)?.[2]}</div>}</Card><Card className="p-6"><Pill tone="blue">RECENT CHECK-INS</Pill><div className="mt-5 space-y-3">{['Today','Yesterday','Tuesday','Monday'].map((d,i)=><div key={d} className="flex justify-between items-center py-2 border-b border-line last:border-0"><span className="text-sm">{d}</span><span className="text-xs text-muted">{i===0?(mood||'Not checked in'):['Normal energy','Low energy','High energy'][i-1]}</span></div>)}</div></Card></div></div>}
function Habits({habits,setHabits}){const [newHabit,setNewHabit]=useState('');const toggle=id=>setHabits(h=>h.map(x=>x.id===id?{...x,done:!x.done,days:x.done?Math.max(0,x.days-1):x.days+1}:x));return <div className="fade"><div className="flex justify-between items-end mb-7"><SectionTitle eyebrow="Tiny actions, over time" title="Habit tracker" sub="Consistency is flexible. Missing a day never erases your progress."/></div><div className="grid lg:grid-cols-[1.5fr_1fr] gap-5"><Card className="p-6"><div className="flex justify-between items-center mb-5"><h2 className="font-bold">Your habits</h2><span className="text-xs text-muted">This week</span></div><div className="space-y-3">{habits.map(h=><div key={h.id} className="flex items-center gap-3 p-3 rounded-xl bg-cream"><button onClick={()=>toggle(h.id)} className={'w-6 h-6 rounded-full flex items-center justify-center border-2 '+(h.done?'bg-[#739d82] border-[#739d82]':'border-[#b9c8bc]')}>{h.done&&<Icon name="check" size={14} className="text-white"/>}</button><div className="flex-1"><div className={'font-semibold text-sm '+(h.done?'text-muted line-through':'')}>{h.name}</div><div className="text-xs text-muted mt-1">{h.goal} · {h.days}/7 this week</div></div><div className="w-20 h-2 bg-white rounded-full overflow-hidden"><div className="h-full bg-[#8aac91]" style={{width:Math.min(100,h.days/7*100)+'%'}}/></div></div>)}</div><div className="flex gap-2 mt-5"><input value={newHabit} onChange={e=>setNewHabit(e.target.value)} className="flex-1 px-3 py-2.5 rounded-xl border border-line bg-white text-sm" placeholder="Add a gentle habit"/><button onClick={()=>{if(newHabit.trim()){setHabits(h=>[...h,{id:uid(),name:newHabit,goal:'Daily',done:false,days:0}]);setNewHabit('')}}} className="px-4 rounded-xl bg-[#557f78] text-white text-sm font-bold"><Icon name="plus" size={16}/></button></div></Card><Card className="p-6 bg-[#e4efdf] border-0"><Icon name="sprout" className="text-[#71956e]"/><h2 className="serif text-2xl mt-4">Your rhythm</h2><p className="text-sm text-[#668061] leading-relaxed mt-2">You showed up for your habits {habits.reduce((a,h)=>a+h.days,0)} times this week. That's something worth noticing.</p><div className="grid grid-cols-7 gap-1 mt-7">{Array.from({length:7},(_,i)=><div key={i} className={'h-8 rounded-md '+(i<5?'bg-[#91b28f]':'bg-white/70')}/>)}</div><div className="flex justify-between text-[10px] text-[#75906f] mt-2"><span>Mon</span><span>Sun</span></div></Card></div></div>}
function Settings({settings,setSettings}){const update=(k,v)=>setSettings(s=>({...s,[k]:v}));return <div className="fade max-w-3xl"><SectionTitle eyebrow="Make FocusFlow feel like yours" title="Settings" sub="Small adjustments can make a big difference."/><div className="space-y-4"><Card className="p-6"><h2 className="font-bold">Focus timer</h2><p className="text-sm text-muted mt-1">Choose a rhythm that feels approachable.</p><div className="grid sm:grid-cols-2 gap-4 mt-5"><label className="text-sm font-semibold">Focus duration<select value={settings.focus} onChange={e=>update('focus',+e.target.value)} className="mt-2 w-full p-3 rounded-xl border border-line"><option value="15">15 minutes</option><option value="25">25 minutes</option><option value="45">45 minutes</option></select></label><label className="text-sm font-semibold">Break duration<select value={settings.break} onChange={e=>update('break',+e.target.value)} className="mt-2 w-full p-3 rounded-xl border border-line"><option value="5">5 minutes</option><option value="10">10 minutes</option><option value="15">15 minutes</option></select></label></div></Card><Card className="p-6"><h2 className="font-bold">Appearance</h2><div className="flex items-center justify-between mt-5"><div><div className="text-sm font-semibold">Larger text</div><div className="text-xs text-muted mt-1">Give your eyes a little more room</div></div><button onClick={()=>update('font',settings.font==='large'?'comfortable':'large')} className={'w-11 h-6 rounded-full transition '+(settings.font==='large'?'bg-[#6f988c]':'bg-[#cbd6d1]')}><span className={'block w-5 h-5 bg-white rounded-full shadow transition '+(settings.font==='large'?'translate-x-5':'translate-x-0.5')}/></button></div></Card><Card className="p-6"><h2 className="font-bold">Preferences</h2>{[['notifications','Gentle reminders','Keep helpful nudges on your radar'],['ambient','Ambient sound','Play a soft background in Focus Room']].map(([k,t,s])=><div key={k} className="flex items-center justify-between mt-5"><div><div className="text-sm font-semibold">{t}</div><div className="text-xs text-muted mt-1">{s}</div></div><button onClick={()=>update(k,!settings[k])} className={'w-11 h-6 rounded-full transition '+(settings[k]?'bg-[#6f988c]':'bg-[#cbd6d1]')}><span className={'block w-5 h-5 bg-white rounded-full shadow transition '+(settings[k]?'translate-x-5':'translate-x-0.5')}/></button></div>)}</Card></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
